name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8081

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ArchForgeWeb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ArchForgeWeb
          # commitlint ranges need the PR base and pushed commit history
          fetch-depth: 0

      # gen:api resolves ../../../ArchForgeSpec from apps/web — keep the two repos side by side.
      - name: Checkout ArchForgeSpec (contract source)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/ArchForgeSpec
          path: ArchForgeSpec

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: ArchForgeWeb/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ArchForgeWeb/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Enforce conventional commits (matches the local husky commit-msg hook).
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD
          else
            pnpm exec commitlint --from HEAD~1 --to HEAD
          fi

      - name: SDK sync check (generated types must match the contract)
        run: |
          cd apps/web
          pnpm gen:api
          git diff --exit-code src/types/schema.d.ts \
            || (echo "::error::schema.d.ts is out of sync with ArchForgeSpec/api/openapi.yaml — run pnpm gen:api and commit" && exit 1)
          cd ../..
          (cd ArchForgeSpec && npm ci --silent && node scripts/gen-enums.mjs)
          git diff --exit-code apps/web/src/types/enums.generated.ts \
            || (echo "::error::enums.generated.ts is out of sync with ArchForgeSpec/enums/enums.yaml" && exit 1)

      # Vulnerability gate: high/critical block the merge; moderate is advisory
      # (tracked, not gating) — tightening to gate once the current backlog clears.
      - name: Audit dependencies (high/critical — blocking)
        run: pnpm audit --registry=https://registry.npmjs.org/ --audit-level=high
      - name: Audit dependencies (moderate — advisory)
        run: pnpm audit --registry=https://registry.npmjs.org/ --audit-level=moderate
        continue-on-error: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # Performance budget: fail the build when client JS/CSS (gzip) outgrows
      # the budgets in apps/web/scripts/check-bundle-size.mjs.
      - name: Bundle size check
        run: pnpm --filter @archforge/web size:check
